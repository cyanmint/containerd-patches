name: Build containerd with env prefix support

on:
  push:
    branches: ["default", "copilot/**"]
  pull_request:
    branches: ["default"]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out patch repository
        uses: actions/checkout@v4

      - name: Clone containerd upstream (main)
        run: |
          git clone --depth=1 https://github.com/containerd/containerd.git /tmp/containerd
          echo "Cloned containerd at commit: $(git -C /tmp/containerd rev-parse HEAD)"

      - name: Apply patches
        working-directory: /tmp/containerd
        run: |
          set -e
          PATCHES="${GITHUB_WORKSPACE}/patches"
          while IFS= read -r -d '' patch; do
            echo "==> Applying ${patch#"$PATCHES/"} ..."
            git apply --whitespace=fix "$patch"
          done < <(find "$PATCHES" -name "*.patch" -print0 | sort -z)
          echo "All patches applied successfully."

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: /tmp/containerd/go.mod
          cache-dependency-path: /tmp/containerd/go.sum

      - name: Build containerd
        working-directory: /tmp/containerd
        run: |
          CGO_ENABLED=0 go build -v -trimpath -tags "netgo osusergo" -o /tmp/bin/containerd ./cmd/containerd
          echo "containerd binary: $(file /tmp/bin/containerd)"

      - name: Build ctr
        working-directory: /tmp/containerd
        run: |
          CGO_ENABLED=0 go build -v -trimpath -tags "netgo osusergo" -o /tmp/bin/ctr ./cmd/ctr
          echo "ctr binary: $(file /tmp/bin/ctr)"

      - name: Build containerd-shim-runc-v2
        working-directory: /tmp/containerd
        run: |
          CGO_ENABLED=0 go build -v -trimpath -tags "netgo osusergo" -o /tmp/bin/containerd-shim-runc-v2 ./cmd/containerd-shim-runc-v2
          echo "shim binary: $(file /tmp/bin/containerd-shim-runc-v2)"

      - name: Verify binaries are fully static
        run: |
          for bin in /tmp/bin/containerd /tmp/bin/ctr /tmp/bin/containerd-shim-runc-v2; do
            echo "==> verifying $bin"
            file "$bin"
            out="$(ldd "$bin" 2>&1 || true)"
            echo "$out"
            echo "$out" | grep -Eq "not a dynamic executable|statically linked" || {
              echo "ERROR: $bin is dynamically linked"
              exit 1
            }
          done

      - name: Smoke-test prefix flags are removed
        run: |
          ! /tmp/bin/containerd --help | grep -q "\-\-prefix" && \
            echo "containerd: --prefix flag absent" || \
            { echo "containerd: --prefix flag still present"; exit 1; }
          ! /tmp/bin/containerd --help | grep -q ", -p" && \
            echo "containerd: -p shorthand absent" || \
            { echo "containerd: -p shorthand still present"; exit 1; }
          ! /tmp/bin/ctr --help | grep -q "\-\-prefix" && \
            echo "ctr: --prefix flag absent" || \
            { echo "ctr: --prefix flag still present"; exit 1; }
          ! /tmp/bin/ctr --help | grep -q ", -p" && \
            echo "ctr: -p shorthand absent" || \
            { echo "ctr: -p shorthand still present"; exit 1; }
          # Verify the shim does NOT accept -prefix/-p as a CLI flag.
          # Prefix is propagated exclusively via the CTR_PREFIX/PREFIX environment
          # variables (inherited from the containerd daemon via os.Environ()).
          ! /tmp/bin/containerd-shim-runc-v2 --help 2>&1 | grep -q "\-prefix" && \
            echo "shim: -prefix flag absent (env-var only)" || \
            { echo "ERROR: shim still registers -prefix CLI flag; must use CTR_PREFIX env var instead"; exit 1; }
          # Sanity-check: starting the shim with -prefix must fail with
          # "flag provided but not defined", proving it has no such flag.
          out="$(/tmp/bin/containerd-shim-runc-v2 -prefix /tmp 2>&1 || true)"
          echo "$out" | grep -q "flag provided but not defined" && \
            echo "shim: -prefix correctly rejected (flag undefined)" || \
            { echo "ERROR: shim accepted -prefix flag unexpectedly"; echo "$out"; exit 1; }

      - name: Stage runc→crun wrapper in artifact bin dir
        run: |
          # Install the repo's bin/runc wrapper alongside the built binaries so
          # that containerd-shim-runc-v2 uses crun as the OCI runtime.
          cp "${GITHUB_WORKSPACE}/bin/runc" /tmp/bin/runc
          chmod +x /tmp/bin/runc
          echo "runc wrapper installed: $(ls -lh /tmp/bin/runc)"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: containerd-env-prefix-binaries-${{ matrix.arch }}
          path: /tmp/bin/
          retention-days: 7
