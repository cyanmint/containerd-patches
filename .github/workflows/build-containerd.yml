name: Build containerd with --prefix support

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Apply patches and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out patch repository
        uses: actions/checkout@v4

      - name: Clone containerd upstream (main)
        run: |
          git clone --depth=1 https://github.com/containerd/containerd.git /tmp/containerd
          echo "Cloned containerd at commit: $(git -C /tmp/containerd rev-parse HEAD)"

      - name: Apply patches
        working-directory: /tmp/containerd
        run: |
          set -e
          PATCHES="${GITHUB_WORKSPACE}/patches"
          for patch in "$PATCHES"/*.patch; do
            echo "==> Applying $(basename "$patch") ..."
            patch -p1 --fuzz=3 < "$patch"
          done
          echo "All patches applied successfully."

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: /tmp/containerd/go.mod
          cache-dependency-path: /tmp/containerd/go.sum

      - name: Build containerd
        working-directory: /tmp/containerd
        run: |
          go build -v -o /tmp/bin/containerd ./cmd/containerd
          echo "containerd binary: $(file /tmp/bin/containerd)"

      - name: Build ctr
        working-directory: /tmp/containerd
        run: |
          go build -v -o /tmp/bin/ctr ./cmd/ctr
          echo "ctr binary: $(file /tmp/bin/ctr)"

      - name: Build containerd-shim-runc-v2
        working-directory: /tmp/containerd
        run: |
          go build -v -o /tmp/bin/containerd-shim-runc-v2 ./cmd/containerd-shim-runc-v2
          echo "shim binary: $(file /tmp/bin/containerd-shim-runc-v2)"

      - name: Smoke-test --prefix flag
        run: |
          /tmp/bin/containerd --help | grep -q "\-\-prefix" && \
            echo "containerd: --prefix flag present" || \
            { echo "containerd: --prefix flag MISSING"; exit 1; }
          /tmp/bin/ctr --help | grep -q "\-\-prefix" && \
            echo "ctr: --prefix flag present" || \
            { echo "ctr: --prefix flag MISSING"; exit 1; }

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: containerd-prefix-binaries
          path: /tmp/bin/
          retention-days: 7
